name: Operating profile acceptance
on:
  pull_request:
    paths:
      - 'forestry-game/**'
      - '.github/workflows/operating-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: forestry-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forestry-game/package-lock.json
      - run: npm ci
      - run: npm run test:operations
      - run: npm test
      - run: npx tsc -p tsconfig.server.json
      - run: npm run build
